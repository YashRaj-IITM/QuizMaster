# Optional services for the background jobs: Redis (Celery broker) and MailHog (local e-mail inbox).
#   docker compose up -d      # start
#   docker compose down       # stop
# MailHog web UI: http://localhost:8025
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
